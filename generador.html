<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generador de Invitaciones — Alejandra y Jorge</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --olive:#4A5C2E; --olive-dark:#324020;
      --gold:#C9A84C;  --gold-light:#E8C96B;
      --lila:#E8E0F0;  --lila-dark:#9B8AB4;
      --cream:#FAF7F0;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Lato',sans-serif;
      background:linear-gradient(135deg,#1a2210 0%,#2d3c18 50%,#1a2210 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .gen-card{
      background:var(--cream); border-radius:24px;
      padding:clamp(32px,5vw,56px);
      max-width:640px; width:100%;
      box-shadow:0 24px 80px rgba(0,0,0,0.5);
    }
    .gen-header{ text-align:center; margin-bottom:40px; }
    .gen-monogram{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(40px,8vw,64px); font-style:italic;
      color:var(--olive-dark); line-height:1;
    }
    .gen-subtitle{
      font-family:'Cinzel',serif; font-size:clamp(10px,1.8vw,12px);
      letter-spacing:5px; text-transform:uppercase; color:var(--gold);
      margin-top:8px;
    }
    .gen-divider{
      width:60px; height:2px;
      background:linear-gradient(to right,var(--gold),var(--gold-light),var(--gold));
      margin:20px auto;
    }
    .gen-title{
      font-family:'Cinzel',serif; font-size:clamp(14px,2.5vw,18px);
      color:var(--olive-dark); letter-spacing:3px; text-align:center; margin-bottom:32px;
    }
    .form-group{ margin-bottom:22px; }
    label{
      display:block; font-family:'Lato',sans-serif; font-size:11px;
      letter-spacing:4px; text-transform:uppercase; color:var(--olive-dark);
      margin-bottom:8px; font-weight:700;
    }
    input[type=text], input[type=number]{
      width:100%; background:#fff; border:1.5px solid var(--lila);
      border-radius:10px; padding:14px 16px; color:#333;
      font-family:'Lato',sans-serif; font-size:15px; outline:none;
      transition:border-color 0.3s;
    }
    input:focus{ border-color:var(--lila-dark); }
    .counter-row{ display:flex; align-items:center; gap:20px; }
    .cnt-btn{
      width:44px;height:44px;border-radius:50%;
      background:transparent; border:1.5px solid var(--olive);
      color:var(--olive); font-size:24px; cursor:pointer;
      transition:background 0.2s; line-height:1;
    }
    .cnt-btn:hover{ background:rgba(74,92,46,0.1); }
    #gen-passes-count{
      font-family:'Cinzel',serif; font-size:32px; color:var(--olive-dark);
      min-width:2ch; text-align:center;
    }
    .hint{ font-size:12px; color:#999; margin-top:6px; font-style:italic; }
    .btn-gen{
      width:100%; padding:16px; margin-top:12px;
      background:linear-gradient(135deg,var(--olive),var(--olive-dark));
      border:none; border-radius:50px; color:#fff;
      font-family:'Cinzel',serif; font-size:clamp(12px,2vw,14px);
      letter-spacing:4px; text-transform:uppercase; cursor:pointer;
      transition:transform 0.2s, box-shadow 0.2s;
    }
    .btn-gen:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(50,64,32,0.4); }
    .btn-copy{
      width:100%; padding:13px; margin-top:10px;
      background:transparent; border:1.5px solid var(--gold);
      border-radius:50px; color:var(--gold);
      font-family:'Cinzel',serif; font-size:clamp(11px,1.8vw,13px);
      letter-spacing:3px; text-transform:uppercase; cursor:pointer;
      transition:background 0.2s;
    }
    .btn-copy:hover{ background:rgba(201,168,76,0.1); }
    .result-box{
      margin-top:28px; padding:20px 24px;
      background:var(--lila); border-radius:14px;
      border:1px solid var(--lila-dark);
      display:none;
    }
    .result-box.visible{ display:block; }
    .result-label{
      font-family:'Lato',sans-serif; font-size:11px; letter-spacing:4px;
      text-transform:uppercase; color:var(--olive-dark); margin-bottom:8px;
    }
    .result-url{
      font-family:'Lato',sans-serif; font-size:13px; color:#333;
      word-break:break-all; line-height:1.6; margin-bottom:16px;
    }
    .preview-link{
      display:inline-block; padding:10px 22px;
      background:var(--olive); color:#fff; text-decoration:none;
      border-radius:50px; font-family:'Cinzel',serif; font-size:11px;
      letter-spacing:3px; text-transform:uppercase;
      transition:background 0.2s; margin-right:8px;
    }
    .preview-link:hover{ background:var(--olive-dark); }
    .copied-msg{
      font-family:'Lato',sans-serif; font-size:13px; color:var(--olive);
      margin-top:10px; min-height:18px; font-style:italic;
    }
    /* Lista de invitados generados */
    .guests-list{ margin-top:32px; }
    .guests-list-title{
      font-family:'Cinzel',serif; font-size:13px; letter-spacing:3px;
      text-transform:uppercase; color:var(--olive-dark); margin-bottom:16px;
      text-align:center;
    }
    .guests-table{ width:100%; border-collapse:collapse; font-size:13px; }
    .guests-table th{ background:var(--olive); color:#fff; padding:10px 12px; font-family:'Cinzel',serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; text-align:left; }
    .guests-table td{ padding:10px 12px; border-bottom:1px solid var(--lila); }
    .guests-table tr:hover td{ background:rgba(232,224,240,0.5); }
    .btn-del{ background:transparent; border:none; color:#c0392b; cursor:pointer; font-size:16px; }
    .no-guests{ text-align:center; color:#999; font-style:italic; padding:16px; }

    @media(max-width:480px){
      .gen-card{ padding:28px 20px; }
    }
  </style>
</head>
<body>
<div class="gen-card">
  <div class="gen-header">
    <div class="gen-monogram">J y A</div>
    <div class="gen-subtitle">22 · Agosto · 2026</div>
    <div class="gen-divider"></div>
  </div>
  <h2 class="gen-title">Generador de Invitaciones</h2>

  <div class="form-group">
    <label for="guest-name">Nombre / Familia</label>
    <input type="text" id="guest-name" placeholder="Ej. Familia García López"/>
    <p class="hint">Este nombre aparecerá en la invitación como destinatario</p>
  </div>

  <div class="form-group">
    <label>Número de pases</label>
    <div class="counter-row">
      <button class="cnt-btn" onclick="changePasses(-1)">−</button>
      <span id="gen-passes-count">2</span>
      <button class="cnt-btn" onclick="changePasses(1)">+</button>
    </div>
    <p class="hint">Máximo de personas que pueden asistir con esta invitación</p>
  </div>

  <button class="btn-gen" onclick="generateLink()">✦ Generar Invitación</button>

  <div class="result-box" id="result-box">
    <p class="result-label">Enlace generado</p>
    <p class="result-url" id="result-url"></p>
    <a class="preview-link" id="preview-link" href="#" target="_blank">Ver invitación</a>
    <button class="btn-copy" onclick="copyLink()">Copiar enlace</button>
    <p class="copied-msg" id="copied-msg"></p>
  </div>

  <!-- Lista de invitados -->
  <div class="guests-list" id="guests-list" style="display:none">
    <p class="guests-list-title">Invitaciones generadas</p>
    <table class="guests-table">
      <thead><tr><th>#</th><th>Nombre / Familia</th><th>Pases</th><th>Enlace</th><th></th></tr></thead>
      <tbody id="guests-tbody"></tbody>
    </table>
  </div>
</div>

<script>
  let passesCount = 2;
  let guestList   = JSON.parse(localStorage.getItem('guestList_AJ') || '[]');

  renderTable();

  function changePasses(d){
    passesCount = Math.max(1, Math.min(20, passesCount + d));
    document.getElementById('gen-passes-count').textContent = passesCount;
  }

  function generateLink(){
    const name   = document.getElementById('guest-name').value.trim();
    if(!name){ alert('Por favor escribe el nombre del invitado.'); return; }

    const encoded = name.replace(/\s+/g,'_');
    const base    = window.location.href.replace('generador.html','');
    const url     = `${base}index.html?n=${encodeURIComponent(encoded)}&p=${passesCount}`;

    document.getElementById('result-url').textContent  = url;
    document.getElementById('preview-link').href       = url;
    document.getElementById('result-box').classList.add('visible');
    document.getElementById('copied-msg').textContent  = '';

    // Guardar en lista
    const entry = { name, passes: passesCount, url };
    guestList.push(entry);
    localStorage.setItem('guestList_AJ', JSON.stringify(guestList));
    renderTable();
  }

  function copyLink(){
    const url = document.getElementById('result-url').textContent;
    navigator.clipboard.writeText(url).then(()=>{
      document.getElementById('copied-msg').textContent = '✓ Enlace copiado al portapapeles';
      setTimeout(()=>document.getElementById('copied-msg').textContent='', 3000);
    });
  }

  function deleteGuest(i){
    guestList.splice(i,1);
    localStorage.setItem('guestList_AJ', JSON.stringify(guestList));
    renderTable();
  }

  function renderTable(){
    const tbody = document.getElementById('guests-tbody');
    const list  = document.getElementById('guests-list');
    tbody.innerHTML = '';
    if(guestList.length === 0){
      list.style.display = 'none'; return;
    }
    list.style.display = 'block';
    guestList.forEach((g,i)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i+1}</td>
        <td>${g.name}</td>
        <td style="text-align:center;font-weight:700;color:var(--olive-dark)">${g.passes}</td>
        <td><a href="${g.url}" target="_blank" style="color:var(--olive-dark);font-size:11px;word-break:break-all">Ver ↗</a></td>
        <td><button class="btn-del" onclick="deleteGuest(${i})" title="Eliminar">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>
</body>
</html>
